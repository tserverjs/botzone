name: CloakBrowser Botzone Login Automation

on:
  schedule:
    - cron: '0 2 * * *'

  workflow_dispatch:

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 Xvfb 虚拟显示、系统依赖及 ffmpeg/字体
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm-dev libasound2t64 ffmpeg ttf-mscorefonts-installer fontconfig
          sudo fc-cache -f -v

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install cloakbrowser easyocr torch torchvision playwright

      - name: 安装 Playwright 所需组件 (包含 ffmpeg)
        run: |
          playwright install ffmpeg

      - name: 运行 CloakBrowser 自动化
        env:
          BOTZONE_USER: ${{ secrets.BOTZONE_USER }}
          BOTZONE_PASS: ${{ secrets.BOTZONE_PASS }}
          CLOAKBROWSER_SUPPRESS_FONT_WARNING: "1"  # 抑制字体警报日志
        run: |
          xvfb-run --server-args="-screen 0 1280x800x24" python main.py

      - name: 上传录制的视频和轨迹报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloakbrowser-recordings
          path: |
            recordings/
            trace.zip
            modal_screenshot.png
          retention-days: 7
