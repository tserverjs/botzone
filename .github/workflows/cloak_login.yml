name: CloakBrowser Botzone Login Automation

on:
  workflow_dispatch: # 手动触发运行

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装 Xvfb 虚拟显示与系统库
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm-dev libasound2

      - name: 安装 CloakBrowser 及相关 Python 依赖
        run: |
          python -m pip install --upgrade pip
          # 安装 CloakBrowser 原生包、EasyOCR 和 PyTorch
          pip install cloakbrowser easyocr torch torchvision playwright

      - name: 在虚拟屏幕下运行 CloakBrowser 自动化
        env:
          BOTZONE_USER: ${{ secrets.BOTZONE_USER }}
          BOTZONE_PASS: ${{ secrets.BOTZONE_PASS }}
        run: |
          # 启动虚拟图形环境运行 CloakBrowser
          xvfb-run --server-args="-screen 0 1280x800x24" python main.py

      - name: 上传录制的视频和轨迹报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloakbrowser-recordings
          path: |
            recordings/
            trace.zip
            modal_screenshot.png
          retention-days: 7
